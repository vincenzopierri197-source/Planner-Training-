name: Publish static GitHub Pages mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build static assets
        run: npm run build
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy static mirror
        id: deployment
        uses: actions/deploy-pages@v5.0.1
